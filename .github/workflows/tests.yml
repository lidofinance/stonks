name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.suite.name }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.suite.timeout }}

    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Unit
            path: test/unit
            timeout: 30
          - name: Acceptance
            path: test/acceptance
            timeout: 30
          # NOTE: the Integration suite runs in integration-tests.yml — it needs a fork with the
          # TokenRateNotifier mock-upgrade applied, which this in-process `--network hardhat`
          # matrix cannot provide. TODO: fold it back here once the notifier is on mainnet.
          - name: Fuzz
            path: test/fuzz
            timeout: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check RPC_URL
        shell: bash
        run: |
          if [[ -z "$RPC_URL" ]]; then
            echo "RPC_URL repository secret is required for mainnet forking." >&2
            exit 1
          fi
        env:
          RPC_URL: ${{ secrets.RPC_URL }}

      - name: Run ${{ matrix.suite.name }} tests
        shell: bash
        run: |
          shopt -s globstar
          npx hardhat test ${{ matrix.suite.path }}/**/*.ts --network hardhat
        env:
          RPC_URL: ${{ secrets.RPC_URL }}

  forge:
    name: Forge (invariant/fuzz)
    # Self-contained (stubs, no fork), so no RPC secret is needed — safe to run on fork PRs too.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.0.0
        with:
          node-version: 20
          cache: npm

      # Forge compiles the contracts with the @openzeppelin remapping into node_modules.
      - name: Install dependencies
        run: npm ci

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0

      - name: Vendor forge-std
        run: git clone --depth 1 --branch v1.16.2 https://github.com/foundry-rs/forge-std lib/forge-std

      - name: Run Forge tests
        run: forge test -vvv
